[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit-lab-universe"
version = "1.0.0"
description = "Reproducible benchmark of Lattimore & Szepesvari Bandit Algorithms (ETC/UCB/MOSS/KL-UCB/Exp3/Exp3-IX/LinUCB/TS) with live-market validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "yfinance>=0.2.40",
  "requests>=2.28",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "pytest>=7.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
